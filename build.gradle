plugins {
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom-remap' version "1.17-SNAPSHOT"
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

group = project.mod_group_id
version = project.mod_version

repositories {
    mavenCentral()
    flatDir {
        dir 'libs'
    }
     maven {
         name = 'ParchmentMC'
         url = 'https://maven.parchmentmc.org'
    }
    maven {
        name 'Curios maven'
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "BlameJared maven"
        url = uri("https://maven.blamejared.com/")
    }
    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup("curse.maven")
        }
    }
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name "CaffeineMC"
        url "https://maven.caffeinemc.net/releases"
    }

    maven { url 'https://jitpack.io' }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        url = "https://repo.sleeping.town/"
    }
    maven {
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "Xander Maven"
        url = "https://maven.isxander.dev/releases"
    }
}

base {
    archivesName = mod_id
}

loom {
    accessWidenerPath = file("src/main/resources/gleam.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft_version}:${project.parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    //implementation name: 'ElysiumAPI-1.21.1-2.0.1'
    /*jarJar(implementation("team.lodestar.lodestone:lodestone")) {
        version {
            prefer lodestone_version
        }
    }*/

    // compileOnly "top.theillusivec4.curios:curios-neoforge:$curios_version:api"
    // runtimeOnly "top.theillusivec4.curios:curios-neoforge:$curios_version"

    include modImplementation("folk.sisby:kaleido-config:0.3.3+1.3.2")
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

    modCompileOnly "net.caffeinemc:sodium-fabric:0.8.13+mc1.21.1"
    modCompileOnly("foundry.veil:veil-fabric-${project.minecraft_version}:4.4.1") {
        exclude group: "maven.modrinth"
        exclude group: "me.fallenbreath"
    }
}

processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching("fabric.mod.json") {
        expand replaceProperties
    }
}

publishing {
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName"}
    }
}